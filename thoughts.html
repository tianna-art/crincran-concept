html,body{height:100%}

}
#app{position:fixed; inset:0}
#gcv{display:block; width:100%; height:100%; touch-action:none; cursor:grab}

header{

.wordmark{

<script>
(function(){
"use strict";

/* ===== 定数 ===== */
var DT      = 0.125;
var BURST0  = 48;
var SPREAD  = 1.0;
var REPEL   = 1150;
var CUT2    = 176400;
var MIND2   = 900;
var VMAX    = 140;
var K_TREE  = 0.055;
var K_POST  = 0.045;
var K_OTHER = 0.014;
var GRAV    = 0.009;
var DAMPB   = 0.86;
var RAD     = [0, 300, 195, 134, 102, 84];
var FLIGHT  = 520;
var STAGGER = 26;

var COLOR = { know:'--c-know', forge:'--c-forge', tune:'--c-tune', make:'--c-make' };
var MODES = ['know','forge','tune','make'];

/* ===== 色 ===== */
function hex2rgb(h){
  h = String(h).trim().replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function mix(a,b,t){
  return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t)];
}
var theme = {}, dirty = true;
function readTheme(){
  var s = getComputedStyle(document.documentElement);
  var g = function(k){ return s.getPropertyValue(k).trim(); };
  theme.node   = hex2rgb(g('--node'));
  theme.edge   = hex2rgb(g('--edge'));
  theme.edgeHi = hex2rgb(g('--edge-hi'));
  theme.ink    = hex2rgb(g('--ink'));
  theme.muted  = hex2rgb(g('--muted'));
  theme.bg     = hex2rgb(g('--bg'));
  theme.brick  = hex2rgb(g('--brick'));
  MODES.forEach(function(m){
    var full = hex2rgb(g(COLOR[m]));
    theme[m]         = full;
    theme['pale_'+m] = mix(full, theme.node, 0.42);
    theme['edge_'+m] = mix(full, theme.edge, 0.45);
  });
  theme.self = theme.ink;
  dirty = false;
}
function colOf(n){
  if(n.kind === 'self') return theme.brick;
  var c = theme[n.group];
  if(!c) return theme.node;
  return n.kind === 'post' ? theme['pale_'+n.group] : c;
}
function edgeColOf(n){ return theme['edge_'+n.group] || theme.edge; }
function cssVarOf(g){ return 'var(' + (COLOR[g] || '--brick') + ')'; }

/* ===== データ ===== */
var DATA = JSON.parse(document.getElementById('graph-data').textContent);
var nodes, links, byId, kids, parentOf, root, adj = {};

/* 1つにしか分岐しない中間ノードは階層を作らない。
   その子（孫）を1つ上に引き上げて、分岐する階層だけを残す。 */
function compact(node, depth){
  var ch = node.children || [];
  ch.forEach(function(c){ compact(c, depth + 1); });
  var out = [];
  ch.forEach(function(c){
    var k = c.children || [];
    while(k.length === 1 && (k[0].children || []).length){
      c.children = k[0].children; k = c.children;
    }
    // 末端ひとつだけを抱えた中間ノードは、その末端に置き換える（テーマは残す）
    if(depth >= 1 && k.length === 1 && !(k[0].children || []).length) out.push(k[0]);
    else out.push(c);
  });
  node.children = out;
}

function buildView(view){
  nodes = []; links = []; byId = {}; kids = {}; parentOf = {};
  root = view.root.id;
  compact(view.root, 0);

  (function walk(spec, parent, depth){
    var n = {
      id: spec.id, label: spec.label || '', group: spec.group || 'know',
      kind: spec.kind || 'post', body: spec.body || '',
      size: spec.size || 0, depth: depth,
      x:0, y:0, vx:0, vy:0, fx:null, fy:null,
      anim:1, appear:1, ox:0, oy:0, ang:0, len:0, t0:0, dur:FLIGHT
    };
    n.q = n.kind === 'self' ? 3.2
        : n.kind === 'theme' ? 2.4
        : n.kind === 'section' ? 1.8
        : n.kind === 'subject' ? 1.3
        : 0.7 + Math.min(1.1, n.size / 1800);
    nodes.push(n); byId[n.id] = n;
    kids[n.id] = [];
    if(parent){
      parentOf[n.id] = parent;
      kids[parent].push(n.id);
      links.push({ s: parent, t: n.id, kind: 'tree', L: RAD[Math.min(depth, RAD.length-1)] });
    }
    (spec.children || []).forEach(function(c){ walk(c, n.id, depth+1); });
  })(view.root, null, 0);

  (view.extraLinks || []).forEach(function(l){
    if(byId[l.source] && byId[l.target])
      links.push({ s:l.source, t:l.target, kind:'post', L:150 });
  });

  adj = {};
  links.forEach(function(l){
    (adj[l.s] = adj[l.s] || []).push(l.t);
    (adj[l.t] = adj[l.t] || []).push(l.s);
  });
}

/* ===== 展開状態 ===== */
var expanded = {}, shown = {};
function initialExpanded(){
  expanded = {}; expanded[root] = true;
  (kids[root] || []).forEach(function(id){ expanded[id] = false; });
  recomputeShown();
}
function recomputeShown(){
  shown = {}; shown[root] = true;
  (function walk(id){
    if(!expanded[id]) return;
    (kids[id] || []).forEach(function(c){ shown[c] = true; walk(c); });
  })(root);
}
function visible(n){ return !!shown[n.id]; }
function pinned(n){ return n.fx !== null || n.anim < 1; }

/* ===== 初期配置 ===== */
function place(id, x, y, ang, spread, depth){
  var n = byId[id]; if(!n) return;
  n.x = x; n.y = y;
  var ks = (kids[id] || []).filter(function(k){ return shown[k]; });
  if(!ks.length) return;
  var r = RAD[Math.min(depth + 1, RAD.length - 1)];
  var sub = Math.min(spread, Math.max(ks.length - 1, 1) * 1.4 / 2.0);
  ks.forEach(function(c, i){
    var a = ks.length === 1 ? ang : (ang - spread/2 + spread * (i + 0.5) / ks.length);
    place(c, x + Math.cos(a)*r, y + Math.sin(a)*r, a, sub, depth + 1);
  });
}

/* ===== 展開アニメ ===== */
var flying = false;
function now(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }

function bloom(prevShown){
  var t0 = now(), order = 0;
  (function walk(id, baseAng, depth){
    var pn = byId[id];
    var ks = (kids[id] || []).filter(function(k){ return shown[k]; });
    if(!ks.length) return;
    var up = parentOf[id], ang0 = baseAng;
    if(up && byId[up]) ang0 = Math.atan2(pn.y - byId[up].y, pn.x - byId[up].x);
    var spread = up ? Math.min(Math.PI * 1.15, 0.55 + ks.length * 0.34) : Math.PI * 2;
    var r = RAD[Math.min(depth + 1, RAD.length - 1)];
    ks.forEach(function(cid, i){
      var c = byId[cid];
      var a = ks.length === 1 ? ang0 : (ang0 - spread/2 + spread * (i + 0.5) / ks.length);
      if(!prevShown[cid]){
        c.ox = pn.x; c.oy = pn.y; c.ang = a; c.len = r;
        c.toX = pn.x + Math.cos(a)*r; c.toY = pn.y + Math.sin(a)*r;
        c.x = pn.x; c.y = pn.y; c.vx = 0; c.vy = 0;
        c.anim = 0; c.appear = 0;
        c.t0 = t0 + (order++) * STAGGER; c.dur = FLIGHT;
        flying = true;
      }
      walk(cid, a, depth + 1);
    });
  })(root, -Math.PI/2, 0);
}

function stepFlight(){
  if(!flying) return;
  var t = now(), moving = false;
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i];
    if(n.anim === undefined || n.anim >= 1) continue;
    moving = true;
    var p = (t - n.t0) / n.dur;
    if(p < 0) continue;
    if(p > 1) p = 1;
    var e = 1 - Math.pow(1 - p, 3);
    var a = n.ang + (1 - e) * 0.55;
    n.x = n.ox + Math.cos(a) * n.len * e;
    n.y = n.oy + Math.sin(a) * n.len * e;
    n.appear = e;
    if(p >= 1){ n.anim = 1; n.appear = 1; n.x = n.toX; n.y = n.toY; }
  }
  if(!moving) flying = false;
}

function toggle(id){
  var n = byId[id]; if(!n) return;
  if(!(kids[id] || []).length) return;
  var prev = {}; for(var k in shown) prev[k] = true;
  if(expanded[id]){
    expanded[id] = false;
    (function prune(i){ (kids[i]||[]).forEach(function(c){ expanded[c] = false; prune(c); }); })(id);
    recomputeShown();
  }else{
    // アコーディオン：開いた枝以外は閉じる。
    // 祖先はそのまま残すので、どのグループの中にいるかは見えたまま重なりだけが消える。
    var keep = {}, up = id;
    while(up){ keep[up] = true; up = parentOf[up]; }
    nodes.forEach(function(n){ if(!keep[n.id]) expanded[n.id] = false; });
    expanded[id] = true;
    recomputeShown();
    // 開くたびに放射状の定位置へ組み直す。枝どうしが重なったまま固まらない。
    var r0 = byId[root];
    place(root, r0.x, r0.y, -Math.PI/2, Math.PI*2, 0);
    bloom(prev);
  }
  burst = BURST0; alpha = 1; hot = 1200;
}

/* ===== 力学 ===== */
var alpha = 1, burst = BURST0, hot = 0;

function step(){
  var boost = burst > 0 ? 1 + 4 * burst / BURST0 : 1;
  var dt   = DT * boost;
  var damp = Math.pow(DAMPB, dt);
  if(burst > 0) burst--;
  if(hot > 0) hot -= 16;

  var act = [], i, j, a, b, dx, dy, d2, d, f;
  for(i=0;i<nodes.length;i++) if(visible(nodes[i])) act.push(nodes[i]);

  for(i=0;i<act.length;i++){
    a = act[i];
    for(j=i+1;j<act.length;j++){
      b = act[j];
      dx = b.x - a.x; dy = b.y - a.y; d2 = dx*dx + dy*dy;
      if(d2 > CUT2) continue;
      d = Math.sqrt(d2) + 0.01;
      f = REPEL * a.q * b.q / Math.max(d2, MIND2) * alpha * dt;
      dx = dx/d*f; dy = dy/d*f;
      if(!pinned(a)){ a.vx -= dx; a.vy -= dy; }
      if(!pinned(b)){ b.vx += dx; b.vy += dy; }
    }
  }

  for(i=0;i<links.length;i++){
    a = byId[links[i].s]; b = byId[links[i].t];
    if(!visible(a) || !visible(b)) continue;
    var kd = links[i].kind;
    var L  = links[i].L * SPREAD;
    var k  = kd === 'tree' ? K_TREE : (kd === 'post' ? K_POST : K_OTHER);
    dx = b.x - a.x; dy = b.y - a.y;
    d = Math.sqrt(dx*dx + dy*dy) + 0.01;
    f = (d - L) * k * alpha * dt;
    dx = dx/d*f; dy = dy/d*f;
    if(!pinned(a)){ a.vx += dx; a.vy += dy; }
    if(!pinned(b)){ b.vx -= dx; b.vy -= dy; }
  }

  for(i=0;i<act.length;i++){
    a = act[i];
    if(pinned(a)){
      if(a.fx !== null){ a.x = a.fx; a.y = a.fy; a.vx = 0; a.vy = 0; }
      continue;
    }
    a.vx -= a.x * GRAV * alpha * dt;
    a.vy -= a.y * GRAV * alpha * dt;
    a.vx *= damp; a.vy *= damp;
    var sp = Math.sqrt(a.vx*a.vx + a.vy*a.vy);
    if(sp > VMAX){ a.vx = a.vx/sp*VMAX; a.vy = a.vy/sp*VMAX; }
    a.x += a.vx * dt; a.y += a.vy * dt;
  }

  var spin = Math.min(1, hot / 1040);
  if(spin > 0.01){
    for(i=0;i<act.length;i++){
      a = act[i];
      if(a.fx !== null || pinned(a)) continue;
      var pid = parentOf[a.id]; if(!pid) continue;
      b = byId[pid]; if(!b) continue;
      dx = a.x - b.x; dy = a.y - b.y;
      var s = 0.0016 * spin;
      a.x = b.x + dx*Math.cos(s) - dy*Math.sin(s);
      a.y = b.y + dx*Math.sin(s) + dy*Math.cos(s);
    }
  }

  alpha += (0.06 - alpha) * 0.012;
}

var reduceRef = { on:false };

/* ===== ビューポート ===== */
var cv = document.getElementById('gcv');
var ctx = cv.getContext('2d');
var W = 0, H = 0, dpr = 1;
var scale = 1, tx = 0, ty = 0, autoFit = true;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dirty = true;
}
window.addEventListener('resize', resize);
function checkSize(){ if(cv.clientWidth !== W || cv.clientHeight !== H) resize(); }
if(window.ResizeObserver){
  new ResizeObserver(function(){
    checkSize();
    if(reduceRef.on){ fit(); draw(); }
  }).observe(cv);
}

function fitTarget(){
  var vis = nodes.filter(visible);
  if(!vis.length) return null;
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  vis.forEach(function(n){
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  });
  var narrow = W < 700;
  var padX = narrow ? 70 : 130;
  var padT = narrow ? 130 : 175;
  var padB = narrow ? 110 : 145;
  var padR = panelOpen && !narrow ? Math.min(380, W * 0.88) : 0;
  var w = (maxX - minX) + padX*2 + padR, h = (maxY - minY) + padT + padB;
  var s = Math.min(W / w, H / h);
  s = Math.max(0.22, Math.min(2.3, s));
  var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  return { scale:s, tx: W/2 - cx*s - padR/2, ty: H/2 - cy*s + (padT - padB)/2 };
}
function fit(){ var t = fitTarget(); if(t){ scale = t.scale; tx = t.tx; ty = t.ty; } }
function easeFit(){
  if(!autoFit) return;
  var t = fitTarget(); if(!t) return;
  var g = 0.075;
  scale += (t.scale - scale) * g;
  tx    += (t.tx - tx) * g;
  ty    += (t.ty - ty) * g;
}
function SX(n){ return n.x * scale + tx; }
function SY(n){ return n.y * scale + ty; }
function toWorld(px, py){ return { x:(px - tx)/scale, y:(py - ty)/scale }; }
function zoomAt(px, py, k){
  var s2 = Math.max(0.12, Math.min(4, scale * k));
  tx = px - (px - tx) * (s2/scale);
  ty = py - (py - ty) * (s2/scale);
  scale = s2; autoFit = false;
}

/* ===== 描画 ===== */
function rad(n){
  var r = n.kind === 'self' ? 26
        : n.kind === 'theme' ? 13
        : n.kind === 'section' ? 9
        : n.kind === 'subject' ? 7
        : 3.2 + Math.min(5.5, n.size / 380);
  r *= Math.max(0.75, Math.min(scale, 1.35));
  return r * (0.5 + 0.5 * (n.appear === undefined ? 1 : n.appear));
}
function orb(x, y, r, col, k){
  var R = r * 2.1;
  var g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0,    rgba(col, 0.95 * k));
  g.addColorStop(0.22, rgba(col, 0.72 * k));
  g.addColorStop(0.46, rgba(col, 0.28 * k));
  g.addColorStop(0.72, rgba(col, 0.08 * k));
  g.addColorStop(1,    rgba(col, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, R, 0, 6.2832); ctx.fill();
}

var hover = null, selected = null;
function draw(){
  if(dirty) readTheme();
  ctx.clearRect(0, 0, W, H);

  var focus = hover || selected;
  var near = {};
  if(focus && shown[focus.id]){ near[focus.id] = 1; (adj[focus.id]||[]).forEach(function(id){ near[id] = 1; }); }
  else focus = null;

  ctx.lineCap = 'round';
  for(var i=0;i<links.length;i++){
    var a = byId[links[i].s], b = byId[links[i].t];
    if(!visible(a) || !visible(b)) continue;
    var lit = focus ? (near[a.id] && near[b.id]) : false;
    var app = Math.min(a.appear, b.appear);
    ctx.strokeStyle = rgba(lit ? theme.edgeHi : edgeColOf(b), (lit ? 0.75 : 0.34) * app);
    ctx.lineWidth = (lit ? 1.3 : 0.85) * Math.max(0.6, Math.min(scale, 1.4));
    if(links[i].kind === 'post') ctx.setLineDash([2, 4]); else ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(SX(a), SY(a)); ctx.lineTo(SX(b), SY(b));
    ctx.stroke();
  }
  ctx.setLineDash([]);

  for(i=0;i<nodes.length;i++){
    var n = nodes[i];
    if(!visible(n)) continue;
    var x = SX(n), y = SY(n), r = rad(n);
    var col = colOf(n);
    var dim = focus && !near[n.id] ? 0.3 : 1;
    orb(x, y, r, col, (n.appear) * dim);
    ctx.fillStyle = rgba(col, 0.9 * n.appear * dim);
    ctx.beginPath(); ctx.arc(x, y, r * 0.42, 0, 6.2832); ctx.fill();
    if((kids[n.id]||[]).length && !expanded[n.id]){
      ctx.strokeStyle = rgba(col, 0.35 * n.appear * dim);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, r * 2.5, 0, 6.2832); ctx.stroke();
    }
    if(selected && n.id === selected.id){
      ctx.strokeStyle = rgba(col, 0.9 * n.appear);
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(x, y, r * 3.1, 0, 6.2832); ctx.stroke();
    }
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var rank = { self:0, theme:1, section:2, subject:3, post:4 };
  var cand = nodes.filter(function(n){ return visible(n) && n.label; })
    .sort(function(a, b){
      if(focus){ if(near[a.id] !== near[b.id]) return (near[b.id]?1:0) - (near[a.id]?1:0); }
      if(rank[a.kind] !== rank[b.kind]) return rank[a.kind] - rank[b.kind];
      return (b.size||0) - (a.size||0);
    });
  var boxes = [];
  for(i=0;i<cand.length;i++){
    var n2 = cand[i], deep = n2.kind === 'post';
    if(deep && !(focus && near[n2.id]) && scale < 0.92) continue;
    var fs = (n2.kind === 'theme' ? 14 : n2.kind === 'section' ? 12 : n2.kind === 'subject' ? 11 : 10.5);
    fs *= Math.max(0.85, Math.min(scale, 1.2));
    ctx.font = (n2.kind === 'theme' ? '600 ' : '') + fs + 'px "Noto Sans JP","Hiragino Sans",sans-serif';
    var tw = ctx.measureText(n2.label).width;
    var lx = SX(n2), ly = SY(n2) + rad(n2) * 2.6 + fs * 0.6;
    var box = [lx - tw/2 - 3, ly - fs/2 - 2, lx + tw/2 + 3, ly + fs/2 + 2];
    var hitFlag = false;
    for(var q=0;q<boxes.length;q++){
      var o = boxes[q];
      if(box[0] < o[2] && box[2] > o[0] && box[1] < o[3] && box[3] > o[1]){ hitFlag = true; break; }
    }
    if(hitFlag) continue;
    boxes.push(box);
    var al = focus && !near[n2.id] ? 0.2 : (deep ? 0.72 : 0.95);
    ctx.fillStyle = rgba(deep ? theme.muted : theme.ink, al * n2.appear);
    ctx.fillText(n2.label, lx, ly);
  }
}

/* ===== ループ ===== */
var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches);
reduceRef.on = reduce;
function frame(){
  checkSize();
  if(!W || !H){ requestAnimationFrame(frame); return; }
  stepFlight(); step(); easeFit(); draw();
  requestAnimationFrame(frame);
}

/* ===== 操作 ===== */
var pointers = {}, dragNode = null, panning = false, moved = 0, last = null, pinchDist = 0;

function pick(px, py){
  var best = null, bd = Infinity;
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i]; if(!visible(n)) continue;
    var dx = SX(n) - px, dy = SY(n) - py, d = Math.sqrt(dx*dx + dy*dy);
    var hit = Math.max(rad(n) * 2.0, 13);
    if(d < hit && d < bd){ bd = d; best = n; }
  }
  return best;
}
function pos(e){ var r = cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }

cv.addEventListener('pointerdown', function(e){
  cv.setPointerCapture(e.pointerId);
  pointers[e.pointerId] = pos(e);
  var ids = Object.keys(pointers);
  if(ids.length === 2){
    var a = pointers[ids[0]], b = pointers[ids[1]];
    pinchDist = Math.hypot(a.x-b.x, a.y-b.y);
    dragNode = null; panning = false; return;
  }
  var p = pos(e); moved = 0; last = p;
  var n = pick(p.x, p.y);
  if(n){ dragNode = n; n.fx = n.x; n.fy = n.y; cv.className = 'grabbing'; }
  else { panning = true; autoFit = false; cv.className = 'grabbing'; }
});

cv.addEventListener('pointermove', function(e){
  var p = pos(e);
  if(pointers[e.pointerId]) pointers[e.pointerId] = p;
  var ids = Object.keys(pointers);
  if(ids.length === 2){
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinchDist > 0) zoomAt((a.x+b.x)/2, (a.y+b.y)/2, d / pinchDist);
    pinchDist = d; return;
  }
  if(dragNode){
    var w = toWorld(p.x, p.y);
    dragNode.fx = dragNode.x = w.x; dragNode.fy = dragNode.y = w.y;
    moved += Math.hypot(p.x - last.x, p.y - last.y); last = p;
    alpha = 0.9; hot = 900; autoFit = false; return;
  }
  if(panning){
    tx += p.x - last.x; ty += p.y - last.y;
    moved += Math.hypot(p.x - last.x, p.y - last.y); last = p; return;
  }
  var n = pick(p.x, p.y);
  if(n !== hover){ hover = n; updatePeek(); }
  else if(hover) updatePeek();
  cv.className = n ? 'pointing' : '';
});

function release(e){
  var wasMoved = moved;
  delete pointers[e.pointerId];
  if(Object.keys(pointers).length < 2) pinchDist = 0;
  if(dragNode){ dragNode.fx = null; dragNode.fy = null; }
  dragNode = null; panning = false; cv.className = '';
  if(wasMoved < 5){
    var p = pos(e), n = pick(p.x, p.y);
    if(n){
      if((kids[n.id]||[]).length) toggle(n.id);
      else openPanel(n.id);
    }else{
      closePanel();
    }
  }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', function(){ hover = null; peek.className = ''; });

cv.addEventListener('wheel', function(e){
  e.preventDefault();
  var p = pos(e);
  zoomAt(p.x, p.y, Math.exp(-e.deltaY * (e.ctrlKey || e.metaKey ? 0.012 : 0.0022)));
}, { passive:false });

cv.addEventListener('dblclick', function(){ autoFit = true; });

/* ===== ホバーカード ===== */
var peek = document.getElementById('peek');
function updatePeek(){
  if(!hover || !hover.label){ peek.className = ''; return; }
  var kc = (kids[hover.id]||[]).length;
  peek.innerHTML = '<div>' + esc(hover.label) + '</div>' +
    '<div class="sub">' + (kc
      ? (kc + ' 件 ・ ' + (expanded[hover.id] ? 'クリックで閉じる' : 'クリックで展開'))
      : (hover.body ? 'クリックで本文' : '断片')) + '</div>';
  peek.className = 'on';
  var r = cv.getBoundingClientRect();
  peek.style.left = Math.min(window.innerWidth - peek.offsetWidth - 12, r.left + SX(hover) + 16) + 'px';
  peek.style.top  = Math.max(8, r.top + SY(hover) - peek.offsetHeight - 12) + 'px';
}

/* ===== 本文パネル ===== */
var panel = document.getElementById('panel');
var pbody = document.getElementById('pbody');
var panelOpen = false;

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function trail(id){
  var out = [], p = parentOf[id];
  while(p){ if(byId[p] && byId[p].label) out.unshift(byId[p].label); p = parentOf[p]; }
  return out;
}
function reveal(id){
  var chain = [], p = parentOf[id], changed = false;
  while(p){ chain.push(p); p = parentOf[p]; }
  chain.forEach(function(x){ if(!expanded[x]){ expanded[x] = true; changed = true; } });
  if(changed){
    var prev = {}; for(var k in shown) prev[k] = true;
    recomputeShown(); bloom(prev);
    burst = BURST0; alpha = 1; hot = 1200; autoFit = true;
  }
}
function openPanel(id){
  var n = byId[id]; if(!n) return;
  reveal(id);
  selected = n;
  var path = trail(id);
  var rel = (adj[id]||[]).filter(function(x){
    return x !== parentOf[id] && byId[x] && byId[x].label && !(kids[x]||[]).length;
  });
  var html = '';
  html += '<div class="crumb"><b>' + esc(path[0] || '') + '</b>' +
          (path.length > 1 ? ' ／ ' + esc(path.slice(1).join(' ／ ')) : '') + '</div>';
  html += '<h2>' + esc(n.label) + '</h2>';
  html += '<div class="rule"></div>';
  html += n.body ? '<p>' + esc(n.body) + '</p>'
                 : '<p style="color:var(--muted)">憧れの入口のひとつ。何に惹かれたかではなく、そのどこに心が反応したのかを拾う。</p>';
  if(rel.length){
    html += '<div class="rel"><h3>つながり</h3>';
    rel.forEach(function(x){
      html += '<button type="button" data-go="' + esc(x) + '">' + esc(byId[x].label) + '</button>';
    });
    html += '</div>';
  }
  pbody.innerHTML = html;
  pbody.style.setProperty('--accent', cssVarOf(n.group));
  pbody.scrollTop = 0;
  Array.prototype.forEach.call(pbody.querySelectorAll('[data-go]'), function(b){
    b.addEventListener('click', function(){ openPanel(b.getAttribute('data-go')); });
  });
  panel.className = 'on'; panelOpen = true; autoFit = true;
}
function closePanel(){
  panel.className = ''; panelOpen = false; selected = null;
}
document.getElementById('pclose').addEventListener('click', closePanel);
window.addEventListener('keydown', function(e){ if(e.key === 'Escape') closePanel(); });

/* ===== ビュー切替 ===== */
var viewBar = document.getElementById('viewBar');
var lede = document.querySelector('#lede p');
var currentView = DATA.views[0].id;

function setView(id, animate){
  var v = DATA.views.filter(function(x){ return x.id === id; })[0];
  if(!v) return;
  currentView = id;
  closePanel();
  buildView(v);
  initialExpanded();
  place(root, 0, 0, -Math.PI/2, Math.PI*2, 0);
  var prev = {}; prev[root] = true;
  nodes.forEach(function(n){ n.toX = n.x; n.toY = n.y; });
  if(animate !== false && !reduce) bloom(prev);
  burst = BURST0; alpha = 1; hot = 1200; autoFit = true;
  if(lede) lede.textContent = v.note || '';
  renderViewBar();
  if(reduce){ for(var w=0; w<4000; w++) step(); fit(); draw(); }
}
function renderViewBar(){
  viewBar.innerHTML = '';
  DATA.views.forEach(function(v){
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = v.label;
    if(v.id === currentView) b.setAttribute('aria-current', 'true');
    b.addEventListener('click', function(){ setView(v.id, true); });
    viewBar.appendChild(b);
  });
}
document.getElementById('greset').addEventListener('click', function(){ setView(currentView, true); });

if(window.matchMedia){
  var mq = matchMedia('(prefers-color-scheme: dark)');
  (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(function(){ dirty = true; });
}

/* ===== 起動 ===== */
resize();
readTheme();
setView(DATA.views[0].id, true);
if(reduce){ draw(); } else { requestAnimationFrame(frame); }

window.brainGraph = { data: DATA, setView: setView, toggle: toggle, open: openPanel,
  fit: function(){ autoFit = true; }, nodes: function(){ return nodes; } };

})();
</script>
